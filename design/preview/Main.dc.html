<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hopswitch — Main window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
.panel{flex:1;background:#171A21;border:1px solid #262B36;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ph{display:flex;align-items:center;gap:12px}
.ic{width:36px;height:36px;border-radius:10px;background:#13201D;display:flex;align-items:center;justify-content:center;flex:none}
.sw{width:48px;height:28px;border-radius:999px;border:0;background:#34D399;padding:4px;display:flex;justify-content:flex-end;cursor:pointer;margin-inline-start:auto}
.kn{width:20px;height:20px;border-radius:50%;background:#04130C}
.cur{background:#13201D;border:1px solid #2C5A4C;border-radius:12px;padding:14px}
.lbl{font-size:12px;color:#9AA3B2}
.item{display:flex;align-items:center;border-radius:10px}
.item:hover{background:#1E222B}
.sel{flex:1;display:flex;align-items:center;gap:12px;padding:10px;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ed{border:0;background:transparent;color:#9AA3B2;padding:8px;border-radius:8px;cursor:pointer}
.rd{width:16px;height:16px;box-sizing:border-box;border-radius:50%;border:2px solid #4A5263;flex:none}
.rd.s{border:5px solid #34D399;background:#04130C}
.tag{font-size:12px;color:#34D399;margin-inline-start:auto}
.add{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:10px;border:1px dashed #3A4150;background:transparent;color:#C9D0DC;font:inherit;font-size:14px;cursor:pointer}
.btn{background:transparent;border:1px solid #333A48;color:#E8EAF0;border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.rl{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#9AA3B2;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rl:hover{background:#1E222B;color:#E8EAF0}
.rl.on{background:#13201D;color:#34D399;box-shadow:inset 3px 0 0 #34D399}
</style>
</helmet>
<div style="width:960px;height:600px;display:flex;background:#0F1115;color:#E8EAF0;box-sizing:border-box">
<nav aria-label="Main" style="width:64px;border-right:1px solid #262B36;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:8px;box-sizing:border-box;flex:none">
<button class="rl on" aria-current="page" aria-label="Home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
<button class="rl" aria-label="Settings" style="margin-top:auto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
<button class="rl" aria-label="About"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
</nav>
<div style="flex:1;display:flex;flex-direction:column;min-width:0">
<header style="display:flex;align-items:center;gap:10px;padding:18px 28px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
<b style="font-size:18px">Hopswitch</b>
<span style="margin-inline-start:auto;font-size:13px;color:#9AA3B2">Proxy and DNS are independent</span>
<button class="btn">Turn everything off</button>
</header>
<div style="flex:1;display:flex;gap:20px;padding:0 28px">
<section class="panel" aria-label="Proxy">
<div class="ph"><div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></div>
<div><b style="font-size:16px">Proxy</b><div class="lbl">Where your traffic goes</div></div>
<button class="sw" role="switch" aria-checked="true" aria-label="Proxy on"><span class="kn"></span></button></div>
<div class="cur"><div class="lbl" style="color:#34D399">● Active</div><b style="font-size:16px">Office</b><div style="font-size:13px;color:#C9D0DC;margin-top:2px">socks5://127.0.0.1:1080</div></div>
<div class="lbl" style="letter-spacing:.08em">SAVED PROXIES</div>
<div class="item"><button class="sel"><span class="rd s"></span><span><b style="font-size:14px">Office</b><div class="lbl">SOCKS5 · 127.0.0.1:1080</div></span><span class="tag">Active</span></button><button class="ed" aria-label="Edit Office"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></div>
<div class="item"><button class="sel"><span class="rd"></span><span><b style="font-size:14px">Home</b><div class="lbl">HTTP · 192.168.1.20:8080</div></span></button><button class="ed" aria-label="Edit Home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></div>
<div class="item"><button class="sel"><span class="rd"></span><span><b style="font-size:14px">Dev tunnel</b><div class="lbl">SOCKS5 · 10.8.0.1:9050</div></span></button><button class="ed" aria-label="Edit Dev tunnel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></div>
<button class="add" style="margin-top:auto"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add proxy</button>
</section>
<section class="panel" aria-label="DNS">
<div class="ph"><div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></div>
<div><b style="font-size:16px">DNS</b><div class="lbl">How names are resolved</div></div>
<button class="sw" role="switch" aria-checked="true" aria-label="DNS on"><span class="kn"></span></button></div>
<div class="cur"><div class="lbl" style="color:#34D399">● Active</div><b style="font-size:16px">Cloudflare</b><div style="font-size:13px;color:#C9D0DC;margin-top:2px">1.1.1.1 · 1.0.0.1</div></div>
<div class="lbl" style="letter-spacing:.08em">SAVED DNS</div>
<div class="item"><button class="sel"><span class="rd s"></span><span><b style="font-size:14px">Cloudflare</b><div class="lbl">1.1.1.1 · 1.0.0.1</div></span><span class="tag">Active</span></button><button class="ed" aria-label="Edit Cloudflare"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></div>
<div class="item"><button class="sel"><span class="rd"></span><span><b style="font-size:14px">Google</b><div class="lbl">8.8.8.8 · 8.8.4.4</div></span></button><button class="ed" aria-label="Edit Google"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></div>
<div class="item"><button class="sel"><span class="rd"></span><span><b style="font-size:14px">Pi-hole</b><div class="lbl">192.168.1.2</div></span></button><button class="ed" aria-label="Edit Pi-hole"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></div>
<button class="add" style="margin-top:auto"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add DNS</button>
</section>
</div>
<footer style="display:flex;gap:10px;align-items:center;color:#9AA3B2;font-size:13px;padding:16px 28px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/></svg>
Your original settings are saved. Switching a panel off restores them exactly.
</footer>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
