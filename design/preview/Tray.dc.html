<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hopswitch — Tray menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
.mi{display:flex;justify-content:space-between;align-items:center;width:100%;box-sizing:border-box;padding:9px 12px;border:0;border-radius:8px;background:transparent;color:inherit;font:inherit;font-size:14px;text-align:left;cursor:pointer}
.mi:hover{background:#222733}
.sec{font-size:11px;letter-spacing:.08em;color:#9AA3B2;padding:10px 12px 4px}
</style>
</helmet>
<div style="width:320px;height:480px;box-sizing:border-box;padding:20px;background:#0F1115;color:#E8EAF0">
<div style="background:#171A21;border:1px solid #262B36;border-radius:14px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.45)">
<div style="padding:8px 12px"><b>Hopswitch</b></div>
<div class="sec">PROXY</div>
<button class="mi">Office<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></button>
<button class="mi">Home</button>
<button class="mi">Off</button>
<div class="sec">DNS</div>
<button class="mi">Cloudflare<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></button>
<button class="mi">Google</button>
<button class="mi">Off (automatic)</button>
<div style="height:1px;background:#262B36;margin:8px 4px"></div>
<button class="mi">Open Hopswitch</button>
<button class="mi">Quit</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":320,"height":480}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
