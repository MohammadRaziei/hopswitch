<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Hopswitch (small sizes)</title>
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#262B36"/>
      <stop offset="1" stop-color="#0B0D11"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D0DC"/>
    </linearGradient>
  </defs>
  <!-- for 16-32 px: just the switch, as large as it can be -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="136" y="352" width="752" height="320" rx="160" fill="#34D399"/>
  <circle cx="728" cy="512" r="128" fill="url(#knob)"/>
</svg>
