<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 160" width="792" height="160">
  <title>Hopswitch</title>
  <g transform="scale(0.15625)">
  <title>Hopswitch</title>
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1E222B"/>
      <stop offset="1" stop-color="#0B0D11"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D0DC"/>
    </linearGradient>
  </defs>
  <!-- dark squircle with a faint green rim, so it stays visible on dark taskbars and docks -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="67" y="67" width="890" height="890" rx="205" fill="none" stroke="#2C5A4C" stroke-width="6"/>
  <g transform="translate(0 24)">
    <!-- the hop: a lopsided arc, thick enough to read as an arrow (not a padlock) at 32 px -->
    <path d="M332 462 C318 236 636 188 676 384" fill="none" stroke="#6EE7B7" stroke-width="76" stroke-linecap="round"/>
    <path d="M737 376 L613 402 L690 470 Z" fill="#6EE7B7" stroke="#6EE7B7" stroke-width="20" stroke-linejoin="round"/>
    <!-- the switch, in its "on" state: green track, light knob, and the spot the knob left -->
    <rect x="212" y="520" width="600" height="240" rx="120" fill="#34D399"/>
    <circle cx="332" cy="640" r="62" fill="none" stroke="#04130C" stroke-width="30"/>
    <circle cx="692" cy="640" r="96" fill="url(#knob)"/>
  </g>
</g>
