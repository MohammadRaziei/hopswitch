[package]
name = "hopswitch"
description = "Switch the system proxy and DNS from the command line, with profiles, rule lists and automatic switching"
version = "0.1.0"
edition = "2021"
# The oldest toolchain the code is built and tested with. Clippy honours it, so it will not
# suggest APIs newer than this.
rust-version = "1.75"
license = "MIT"
authors = ["Hopswitch contributors"]
repository = "https://github.com/MohammadRaziei/hopswitch"
homepage = "https://github.com/MohammadRaziei/hopswitch"
readme = "README.md"
keywords = ["proxy", "dns", "pac", "cli", "network"]
categories = ["command-line-utilities", "network-programming"]
# What goes to crates.io: the code, its tests and examples. Not the design files, the docs or the CI.
include = ["/src", "/tests", "/examples", "/README.md", "/LICENSE", "/Cargo.toml", "/Cargo.lock"]

# The library is `hopswitch` (modules: core, storage, http, probe, platform_windows, pacserver, cli) and
# the program is `hopswitch` too; see ADR-0013.
[[bin]]
name = "hopswitch"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
base64 = "0.22"
getrandom = { version = "0.2", features = ["std"] }

[dev-dependencies]
# Pinned: newer releases need a Rust toolchain with edition 2024 support.
tempfile = "=3.10.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Every public type can be printed in a log or a failed assertion; hand-write it to hide secrets.
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# What the release workflow ships. No `panic = "abort"`: the HTTP server turns a handler panic into a
# 500 with `catch_unwind` (hopswitch::http), which needs unwinding.
[profile.release]
strip = true
lto = true
codegen-units = 1

# Linux packages, built by .github/workflows/package.yml from the static musl binary, so they need
# no libraries from the system. Both tools read the program from target/release/hopswitch.
[package.metadata.deb]
name = "hopswitch"
maintainer = "Hopswitch contributors"
copyright = "Hopswitch contributors"
license-file = ["LICENSE", "0"]
extended-description = "Switch the system proxy and DNS from the command line, with profiles, rule lists and automatic switching."
section = "net"
priority = "optional"
depends = ""
assets = [
    ["target/release/hopswitch", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/hopswitch/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "hopswitch"
summary = "Switch the system proxy and DNS from the command line"
license = "MIT"
assets = [
    { source = "target/release/hopswitch", dest = "/usr/bin/hopswitch", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/hopswitch/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/hopswitch/LICENSE", mode = "644", license = true },
]
