[workspace]
resolver = "2"
members = ["crates/core", "crates/storage", "crates/platform-windows", "crates/cli", "crates/probe", "crates/pacserver"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The oldest toolchain the code is built and tested with. Clippy honours it, so it will not
# suggest APIs newer than this.
rust-version = "1.75"
license = "MIT"
authors = ["Hopswitch contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Every public type can be printed in a log or a failed assertion; hand-write it to hide secrets.
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
