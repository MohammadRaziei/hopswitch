[workspace]
resolver = "2"
members = ["crates/core", "crates/storage", "crates/platform-windows", "crates/cli", "crates/probe", "crates/pacserver", "crates/http"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The oldest toolchain the code is built and tested with. Clippy honours it, so it will not
# suggest APIs newer than this.
rust-version = "1.75"
license = "MIT"
authors = ["Hopswitch contributors"]
repository = "https://github.com/MohammadRaziei/hopswitch"
homepage = "https://github.com/MohammadRaziei/hopswitch"
readme = "README.md"
keywords = ["proxy", "dns", "pac", "cli", "network"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
# The crates of this workspace. `version` is what crates.io needs; `path` is what the build uses.
hopswitch-core = { path = "crates/core", version = "0.1.0" }
hopswitch-storage = { path = "crates/storage", version = "0.1.0" }
hopswitch-http = { path = "crates/http", version = "0.1.0" }
hopswitch-probe = { path = "crates/probe", version = "0.1.0" }
hopswitch-platform-windows = { path = "crates/platform-windows", version = "0.1.0" }
hopswitch-pacserver = { path = "crates/pacserver", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Every public type can be printed in a log or a failed assertion; hand-write it to hide secrets.
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# What the release workflow ships. No `panic = "abort"`: the HTTP server turns a handler panic into a
# 500 with `catch_unwind` (hopswitch-http), which needs unwinding.
[profile.release]
strip = true
lto = true
codegen-units = 1
