name: Release

# Same idea as liburlparser:
#   * a push to master builds everything and puts it in the pre-release called `__beta__`
#     (its files are replaced each time, and its tag moves to the new commit);
#   * a tag `v<version>` does the same into a real release named after the tag.
# Anything else (a manual run on another branch) only builds, and publishes nothing.
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

# One release at a time, in order: a second push waits instead of cutting the first one short.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.init.outputs.release_name }}
      is_tag: ${{ steps.init.outputs.is_tag }}
      version: ${{ steps.init.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide what this run is
        id: init
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            release_name="$GITHUB_REF_NAME"
            is_tag=true
          else
            release_name="__beta__"
            is_tag=false
          fi
          {
            echo "version=$version"
            echo "release_name=$release_name"
            echo "is_tag=$is_tag"
          } | tee -a "$GITHUB_OUTPUT"

  package:
    needs: [init]
    uses: ./.github/workflows/package.yml

  publish:
    name: publish ${{ needs.init.outputs.release_name }}
    needs: [init, package]
    # Only a tag or master may touch a release.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_NAME: ${{ needs.init.outputs.release_name }}
      IS_TAG: ${{ needs.init.outputs.is_tag }}
      VERSION: ${{ needs.init.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Write the release text
        run: |
          if [ "$IS_TAG" = "true" ]; then
            note=""
          else
            note="> **Development build** of the latest \`master\` (commit \`${GITHUB_SHA::7}\`), replaced on every push. For a stable version, use a release with a version number."
          fi
          sed -e "s|RELEASE_NAME|$RELEASE_NAME|g" \
              -e "s|VERSION_STRING|$VERSION|g" \
              -e "s|BUILD_NOTE|$note|" \
              .github/release_template.md > release.md
          cat release.md

      # Everything below runs only after every file has been built, so a failed build leaves the
      # previous release as it was.
      - name: Move the beta tag to this commit
        if: env.IS_TAG != 'true'
        run: |
          git tag -f "$RELEASE_NAME" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_NAME"

      - name: Create or update the release and replace its files
        run: |
          prerelease=true
          [ "$IS_TAG" = "true" ] && prerelease=false
          if gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while read -r asset; do
                gh release delete-asset "$RELEASE_NAME" "$asset" --yes --repo "$GITHUB_REPOSITORY"
              done
            gh release edit "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_NAME" \
              --notes-file release.md --prerelease="$prerelease"
          else
            flag=""
            [ "$prerelease" = "true" ] && flag="--prerelease"
            gh release create "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_NAME" \
              --notes-file release.md $flag
          fi
          gh release upload "$RELEASE_NAME" dist/* --repo "$GITHUB_REPOSITORY"

  # Written whatever happened, like the report of ci.yml. It goes to the `ci-report` branch as
  # `release.md`, not onto the release, because a failed build never reaches the release.
  report:
    name: release report
    if: always()
    needs: [init, package, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/report.py --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --skip "release report" --out report.md
      - name: Show it on the run page
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      # A pull request from a fork has a read-only token; a push or a manual run does not.
      - name: Publish it to the ci-report branch
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/ci/publish.sh report.md release.md
