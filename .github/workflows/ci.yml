name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt + clippy on one OS only: new clippy versions add lints over time, and a lint failure
  # must not hide the test results of the other jobs.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-fail-fast

  # A real-machine check of the Windows proxy adapter (CHECKLIST Step 4): the runner is a
  # throwaway Windows VM, so changing its proxy settings is safe. It applies a preset
  # through the CLI, reads the registry, restores, and checks the original is back.
  windows-proxy-smoke:
    name: Windows proxy adapter (real registry)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p hopswitch-cli
      - name: apply, verify, restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hs = Join-Path $PWD 'target\debug\hopswitch.exe'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
          function Hs { & $hs @args; if ($LASTEXITCODE -ne 0) { throw "hopswitch $args failed ($LASTEXITCODE)" } }
          function Show-Proxy { Get-ItemProperty $key | Select-Object ProxyEnable, ProxyServer, ProxyOverride | Format-List | Out-String }

          $before = Get-ItemProperty $key
          "before:`n$(Show-Proxy)"

          Hs status
          Hs proxy use v2rayn-socks
          $during = Get-ItemProperty $key
          "during:`n$(Show-Proxy)"
          if ($during.ProxyEnable -ne 1) { throw 'proxy was not enabled' }
          if ($during.ProxyServer -notmatch '10808') { throw "unexpected ProxyServer: $($during.ProxyServer)" }

          Hs status
          Hs off
          $after = Get-ItemProperty $key
          "after:`n$(Show-Proxy)"
          # What `off` promises: the proxy is switched off again and no PAC script is left behind.
          if ([int]$after.ProxyEnable -ne [int]$before.ProxyEnable) { throw 'ProxyEnable was not restored' }
          if ($after.AutoConfigURL) { throw "unexpected AutoConfigURL: $($after.AutoConfigURL)" }
          if (((& $hs status | Out-String)) -notmatch 'proxy: off') { throw 'status does not say the proxy is off' }
          # Known gap (see CHECKLIST, Step 4): a disabled proxy's leftover ProxyServer text is
          # not restored. Report it, do not fail.
          if ($after.ProxyServer -ne $before.ProxyServer) {
            Write-Host "::notice::ProxyServer left behind after off: '$($after.ProxyServer)' (was '$($before.ProxyServer)')"
          }
