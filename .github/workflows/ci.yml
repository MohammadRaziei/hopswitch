name: CI

on:
  # Every branch, so a push to any branch gets a result (and a report): the user pushes, we read.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The PAC generator tests run the script in Node (preinstalled on the runners). With this set a
  # missing Node fails the test instead of skipping it, so the check cannot silently vanish.
  HOPSWITCH_REQUIRE_NODE: "1"

jobs:
  # fmt + clippy on one OS only: new clippy versions add lints over time, and a lint failure
  # must not hide the test results of the other jobs.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Broken intra-doc links and bad doc markup are errors, not warnings nobody reads.
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Tests of the CI report script
        run: python3 -m unittest discover -s tools/ci -v

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-fail-fast

  # `rust-version` in Cargo.toml is a promise: build and test with exactly that toolchain.
  msrv:
    name: test (Rust 1.75, the declared minimum)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-fail-fast

  # A real-machine check of the Windows proxy adapter (CHECKLIST Step 4): the runner is a
  # throwaway Windows VM, so changing its proxy settings is safe. It applies a preset
  # through the CLI, reads the registry, restores, and checks the original is back.
  windows-proxy-smoke:
    name: Windows proxy adapter (real registry)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p hopswitch-cli
      - name: apply, verify, restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hs = Join-Path $PWD 'target\debug\hopswitch.exe'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
          function Hs { & $hs @args; if ($LASTEXITCODE -ne 0) { throw "hopswitch $args failed ($LASTEXITCODE)" } }
          function Show-Proxy { Get-ItemProperty $key | Select-Object ProxyEnable, ProxyServer, ProxyOverride | Format-List | Out-String }
          # The registry is back to what it was (an absent value and an empty one count as the same).
          function Assert-Same($before, $after) {
            if ([int]$after.ProxyEnable -ne [int]$before.ProxyEnable) { throw 'ProxyEnable was not restored' }
            foreach ($name in 'ProxyServer', 'ProxyOverride', 'AutoConfigURL') {
              if ([string]$after.$name -ne [string]$before.$name) { throw "$name was not restored: '$($after.$name)' (was '$($before.$name)')" }
            }
          }

          $before = Get-ItemProperty $key
          "before:`n$(Show-Proxy)"

          Hs status
          Hs proxy use v2rayn-socks
          $during = Get-ItemProperty $key
          "during:`n$(Show-Proxy)"
          if ($during.ProxyEnable -ne 1) { throw 'proxy was not enabled' }
          if ($during.ProxyServer -notmatch '10808') { throw "unexpected ProxyServer: $($during.ProxyServer)" }

          Hs status
          Hs off
          $after = Get-ItemProperty $key
          "after:`n$(Show-Proxy)"
          Assert-Same $before $after
          if (((& $hs status | Out-String)) -notmatch 'proxy: off') { throw 'status does not say the proxy is off' }

          # Second round: the proxy is switched off but Windows still stores an address, which it
          # does by default after a proxy was used once. Restoring must bring that address back.
          Set-ItemProperty -Path $key -Name ProxyServer -Value 'corp.example:3128'
          Set-ItemProperty -Path $key -Name ProxyOverride -Value '<local>'
          Set-ItemProperty -Path $key -Name ProxyEnable -Value 0 -Type DWord
          $before = Get-ItemProperty $key
          "before (stored address):`n$(Show-Proxy)"
          if (((& $hs status | Out-String)) -notmatch 'proxy: off') { throw 'a stored but switched-off proxy should read as off' }
          Hs proxy use v2rayn-socks
          if ((Get-ItemProperty $key).ProxyServer -notmatch '10808') { throw 'the proxy was not applied over the stored address' }
          Hs off
          $after = Get-ItemProperty $key
          "after (stored address):`n$(Show-Proxy)"
          Assert-Same $before $after

  # Runs after every other job, green or red, and writes what happened to the `ci-report` branch
  # (file ci.md): the failed jobs with the lines of their logs that say why. Whoever pushed does not
  # have to copy anything from this page; the report can be read at
  # https://raw.githubusercontent.com/<owner>/<repo>/ci-report/ci.md
  # It never fails the run itself (a report that cannot be written is a warning).
  report:
    name: failure report
    if: always()
    needs: [lint, test, msrv, windows-proxy-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/report.py --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --skip "failure report" --out report.md
      - name: Show it on the run page
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      # Pushes of this repository only: a pull request from a fork has a read-only token.
      - name: Publish it to the ci-report branch
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/ci/publish.sh report.md ci.md
