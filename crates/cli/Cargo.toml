[package]
name = "hopswitch-cli"
description = "Command-line interface for Hopswitch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "hopswitch"
path = "src/main.rs"

[dependencies]
hopswitch-core = { path = "../core" }
hopswitch-storage = { path = "../storage" }
hopswitch-platform-windows = { path = "../platform-windows" }
hopswitch-probe = { path = "../probe" }
hopswitch-http = { path = "../http" }
getrandom = { version = "0.2", features = ["std"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "=3.10.1"
