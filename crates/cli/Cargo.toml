[package]
name = "hopswitch-cli"
description = "Command-line interface for Hopswitch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "hopswitch"
path = "src/main.rs"

[dependencies]
hopswitch-core = { workspace = true }
hopswitch-storage = { workspace = true }
hopswitch-platform-windows = { workspace = true }
hopswitch-probe = { workspace = true }
hopswitch-http = { workspace = true }
getrandom = { version = "0.2", features = ["std"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "=3.10.1"

# Linux packages, built by .github/workflows/release.yml from the static musl binary, so they need
# no libraries from the system. `cargo deb --target T` and `cargo generate-rpm --target T` look for
# the binary in target/T/release/.
[package.metadata.deb]
name = "hopswitch"
maintainer = "Hopswitch contributors"
copyright = "Hopswitch contributors"
license-file = ["../../LICENSE", "0"]
extended-description = "Switch the system proxy and DNS from the command line, with profiles, rule lists and automatic switching."
section = "net"
priority = "optional"
depends = ""
assets = [
    ["target/release/hopswitch", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/hopswitch/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "hopswitch"
summary = "Switch the system proxy and DNS from the command line"
license = "MIT"
assets = [
    { source = "../../target/release/hopswitch", dest = "/usr/bin/hopswitch", mode = "755" },
    { source = "../../README.md", dest = "/usr/share/doc/hopswitch/README.md", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/hopswitch/LICENSE", mode = "644", license = true },
]
